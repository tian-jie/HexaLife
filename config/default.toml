[map]
width = 1000
height = 1000

[sim]
max_days = 10000

[initial]
seed = 1
initial_population = 10_000_000
# 初始暴发「格」数；格内每名健康者以 0 代总感染率 P_g（disease.infection_rate[0]）独立判定是否感染
initial_infected_count = 1
initial_infection_mode = "random"
initial_infection_cell = 0

[density]
lambda_bg = 0.2
truncation = 4.0
# cell = r * width + q，须满足 0 <= cell < width * height（当前最大 999999）
# 与 10000×10000 默认六中心同比例缩放至 1000×1000
centers = [
  { cell = 250000, peak = 4.0, sigma = 20.0 },
  { cell = 750000, peak = 4.0, sigma = 20.0 },
  { cell = 500500, peak = 4.0, sigma = 20.0 },
  { cell = 250500, peak = 4.0, sigma = 20.0 },
  { cell = 750500, peak = 4.0, sigma = 20.0 },
  { cell = 500000, peak = 4.0, sigma = 20.0 },
]

[disease]
incubation_days = 7
immune_days = 180
infection_rate = [0.70, 0.55, 0.45, 0.25]
lethality_rate = [0.40, 0.30, 0.20, 0.05]
infected_can_move = true

[vital]
birth_rate_per_day = 0.0001
natural_death_rate_per_day = 0.00005

[movement.commute]
probability = 0.30
distance_min = 1
distance_max = 5
tau = 1.0
beta = 1.0

[movement.visit]
probability = 0.007142857142857143
distance_min = 6
distance_max = 50
tau = 10.0
beta = 0.1

[movement.travel]
probability = 0.0000273972602739726
distance_min = 51
distance_max = 100
tau = 80.0
beta = 0.0

[ui]
c_bright = 64
refresh_interval_ms = 100
speed_min = 1.0
speed_max = 60.0
default_speed = 10.0
speed_fastest = -1.0
